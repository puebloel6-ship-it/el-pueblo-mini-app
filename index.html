<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EL PUEBLO</title>
  <style>
    :root {
      --oro: #ffd329;
      --nero: #17130f;
      --blu: #17629a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--nero);
      color: white;
      font-family: Arial, sans-serif;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .schermo {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 18px;
      background:
        radial-gradient(circle at top right, #275b7c 0, transparent 45%),
        linear-gradient(145deg, #17130f, #282019);
    }

    .home {
      width: 100%;
      max-width: 480px;
      text-align: center;
      padding-top: 5vh;
    }

    .eyebrow {
      display: inline-block;
      color: var(--nero);
      background: var(--oro);
      border: 2px solid white;
      border-radius: 6px;
      padding: 7px 12px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .art {
      margin: 22px auto;
      width: 100%;
      max-width: 430px;
    }

    .art img {
      display: block;
      width: 100%;
      height: auto;
      border: 4px solid var(--oro);
      border-radius: 16px;
      box-shadow: 0 8px 0 #000;
    }

    h1 {
      margin: 18px 0 10px;
      color: var(--oro);
      font-size: clamp(38px, 10vw, 60px);
      font-weight: 1000;
      line-height: .95;
      letter-spacing: -2px;
      text-transform: uppercase;
      -webkit-text-stroke: 1px white;
      text-shadow: 4px 4px 0 #000;
    }

    .sottotitolo {
      font-size: 14px;
      letter-spacing: 3px;
      font-weight: 800;
    }

    .descrizione {
      color: #e4ded5;
      line-height: 1.5;
      margin: 20px auto;
      max-width: 340px;
    }

    .pulsante {
      width: 100%;
      max-width: 330px;
      padding: 17px;
      color: var(--nero);
      background: var(--oro);
      border: 3px solid white;
      border-radius: 12px;
      box-shadow: 0 5px 0 #000;
      font-size: 17px;
      font-weight: 1000;
      text-transform: uppercase;
    }

    .nota {
      color: #c8c0b6;
      font-size: 12px;
      margin-top: 22px;
    }

    .catalogo {
      display: none;
      width: 100%;
      max-width: 480px;
      padding: 24px 0;
    }

    .catalogo h2 {
      color: var(--oro);
      text-transform: uppercase;
    }

    .categoria {
      width: 100%;
      padding: 16px;
      margin: 8px 0;
      background: #29231c;
      border: 2px solid var(--oro);
      border-radius: 10px;
      color: white;
      text-align: left;
      font-weight: bold;
    }

    .indietro {
      margin-top: 20px;
      background: transparent;
      color: var(--oro);
      border: 1px solid var(--oro);
      padding: 12px 18px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main class="schermo">
    <section class="home" id="home">
      <div class="eyebrow">BENVENUTO NELLA FAMIGLIA</div>

      <div class="art">
        <img src="./el-pueblo-mascotte.jpg" alt="Mascotte EL PUEBLO">
      </div>

      <h1>EL PUEBLO</h1>
      <div class="sottotitolo">IDENTITÀ · STRADA · FAMIGLIA</div>

      <p class="descrizione">
        Entra nel mondo EL PUEBLO e scopri il nostro spazio.
      </p>

      <button class="pulsante" onclick="apriCatalogo()">
        ENTRA NEL CATALOGO
      </button>

      <p class="nota">EL PUEBLO · MINI APP</p>
    </section>

    <section class="catalogo" id="catalogo">
      <h2>IL CATALOGO</h2>
      <p>Benvenuto in EL PUEBLO.</p>
      <button class="categoria">DRY</button>
      <button class="categoria">INDICA</button>
      <button class="categoria">SATIVA</button>
      <button class="categoria">FUORI MENU</button>
      <button class="indietro" onclick="tornaHome()">← TORNA ALLA HOME</button>
    </section>
  </main>

  <script>
    function apriCatalogo() {
      document.getElementById("home").style.display = "none";
      document.getElementById("catalogo").style.display = "block";
    }

    function tornaHome() {
      document.getElementById("catalogo").style.display = "none";
      document.getElementById("home").style.display = "block";
    }
  </script>
</body>
</html>
